# Local development database. Production uses a managed PostgreSQL (see docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hp
      POSTGRES_PASSWORD: hp_dev_password
      POSTGRES_DB: hotelproc_dev
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data', './scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init.sql:ro']
volumes:
  pgdata:
